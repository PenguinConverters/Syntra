name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Consumer.AzureSQL.Database is a Visual Studio SSDT project: it imports targets
  # that ship with Visual Studio, so it builds with MSBuild.exe and not the dotnet
  # CLI. That confines it to a Windows runner, which carries the SSDT component and
  # DacFx. MSBuild is located through vswhere rather than a separate action.
  # ---------------------------------------------------------------------------
  database:
    name: Database (dacpac)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build database project
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild.exe not found on this runner." }
          Write-Host "Using $msbuild"
          & $msbuild "Consumer.AzureSQL.Database\Consumer.AzureSQL.Database.sqlproj" -t:Build -p:Configuration=Release -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload dacpac
        uses: actions/upload-artifact@v7
        with:
          name: Database-dacpac
          path: Consumer.AzureSQL.Database/bin/Release/*.dacpac
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The Keyra SDK is proprietary but published on nuget.org, so restore needs no
  # credentials and this job gives real signal on every pull request.
  # ---------------------------------------------------------------------------
  build:
    name: Build & test (.NET)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build solution
        run: dotnet build Syntra.CI.slnf -c Release --nologo

      - name: Run tests
        run: >-
          dotnet test Syntra.CI.slnf -c Release --nologo --no-build
          --logger "trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14
